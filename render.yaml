services:
  - type: web
    name: aka-crypto-bot
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 Bot_v7.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
